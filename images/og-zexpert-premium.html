<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    font-family: 'Montserrat', 'Arial Black', sans-serif;
    background: #05121e;
  }
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;800&family=Lato:wght@300;400&display=swap');

  .canvas {
    width: 1200px; height: 630px; position: relative; overflow: hidden;
    background: linear-gradient(135deg, #05121e 0%, #071c2a 45%, #071a28 100%);
  }

  /* Grille de points subtile */
  .dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(circle, rgba(16,157,187,0.08) 1px, transparent 1px);
    background-size: 32px 32px;
  }

  /* Lignes diagonales décoratives */
  .lines-svg {
    position: absolute; inset: 0; width: 100%; height: 100%;
  }

  /* Cercle glow gauche */
  .glow-left {
    position: absolute; left: -120px; top: 50%; transform: translateY(-50%);
    width: 560px; height: 560px; border-radius: 50%;
    background: radial-gradient(circle, rgba(16,157,187,0.12) 0%, transparent 70%);
  }

  /* Cercle glow droit */
  .glow-right {
    position: absolute; right: -80px; bottom: -80px;
    width: 400px; height: 400px; border-radius: 50%;
    background: radial-gradient(circle, rgba(244,212,77,0.07) 0%, transparent 70%);
  }

  /* Barre accent gauche */
  .accent-bar {
    position: absolute; left: 0; top: 0; bottom: 0; width: 5px;
    background: linear-gradient(to bottom, transparent 0%, #109DBB 30%, #F4D44D 70%, transparent 100%);
  }

  /* Contenu centré */
  .content {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 60px 80px;
  }

  /* Eyebrow badge */
  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    background: rgba(16,157,187,0.12); border: 1px solid rgba(16,157,187,0.30);
    padding: 8px 22px; border-radius: 50px;
    font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 13px;
    color: #7DDAEE; letter-spacing: 0.18em; text-transform: uppercase;
    margin-bottom: 40px;
    backdrop-filter: blur(8px);
  }
  .eyebrow::before {
    content: ''; width: 6px; height: 6px; border-radius: 50%;
    background: #7DDAEE; flex-shrink: 0;
  }

  /* Wordmark */
  .wordmark-wrap {
    position: relative; margin-bottom: 32px;
  }
  .wordmark-accent {
    position: absolute; bottom: 2px; left: 0;
    width: 100%; height: 10px;
    background: #F4D44D; opacity: 0.85;
    transform: skewX(-1deg);
    border-radius: 1px;
  }
  .wordmark {
    position: relative; z-index: 1;
    font-family: 'Montserrat', 'Arial Black', sans-serif;
    font-weight: 800; font-size: 96px; letter-spacing: -0.01em;
    color: #109DBB; line-height: 1;
  }
  .wordmark span { color: #F4D44D; }

  /* Séparateur */
  .divider {
    width: 60px; height: 2px;
    background: linear-gradient(to right, #109DBB, #F4D44D);
    margin-bottom: 28px; border-radius: 2px;
  }

  /* Tagline */
  .tagline {
    font-family: 'Montserrat', sans-serif; font-weight: 300; font-size: 22px;
    color: rgba(255,255,255,0.75); letter-spacing: 0.04em; text-align: center;
    line-height: 1.5; margin-bottom: 40px;
  }
  .tagline strong {
    font-weight: 600; color: rgba(255,255,255,0.95);
  }

  /* Localisation */
  .location {
    display: flex; align-items: center; gap: 16px;
    font-family: 'Lato', 'Montserrat', sans-serif; font-weight: 400; font-size: 14px;
    color: rgba(255,255,255,0.38); letter-spacing: 0.14em; text-transform: uppercase;
  }
  .location-dot {
    width: 3px; height: 3px; border-radius: 50%; background: rgba(255,255,255,0.25);
  }

  /* Coin bas-droite : site */
  .url-badge {
    position: absolute; bottom: 36px; right: 48px;
    font-family: 'Montserrat', sans-serif; font-weight: 400; font-size: 14px;
    color: rgba(255,255,255,0.28); letter-spacing: 0.06em;
  }

  /* Coin bas-gauche : certification */
  .cert-badge {
    position: absolute; bottom: 30px; left: 48px;
    display: flex; align-items: center; gap: 8px;
  }
  .cert-icon {
    width: 20px; height: 20px; border-radius: 50%;
    border: 1.5px solid rgba(244,212,77,0.4);
    display: flex; align-items: center; justify-content: center;
  }
  .cert-text {
    font-family: 'Montserrat', sans-serif; font-size: 12px; font-weight: 500;
    color: rgba(244,212,77,0.6); letter-spacing: 0.08em;
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;800&family=Lato:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>
<div class="canvas">
  <div class="dots"></div>

  <!-- Glows -->
  <div class="glow-left"></div>
  <div class="glow-right"></div>

  <!-- Lignes SVG décoratives -->
  <svg class="lines-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
    <!-- Ligne diagonale supérieure -->
    <line x1="700" y1="0" x2="1200" y2="280" stroke="rgba(16,157,187,0.08)" stroke-width="1"/>
    <line x1="750" y1="0" x2="1200" y2="230" stroke="rgba(16,157,187,0.05)" stroke-width="1"/>
    <!-- Lignes bottom -->
    <line x1="0" y1="450" x2="400" y2="630" stroke="rgba(16,157,187,0.06)" stroke-width="1"/>
    <!-- Arc décoratif -->
    <circle cx="1100" cy="80" r="180" fill="none" stroke="rgba(16,157,187,0.05)" stroke-width="1"/>
    <circle cx="1100" cy="80" r="140" fill="none" stroke="rgba(244,212,77,0.04)" stroke-width="1"/>
    <!-- Petit carré accent -->
    <rect x="80" y="80" width="18" height="18" fill="none" stroke="rgba(16,157,187,0.20)" stroke-width="1.5" transform="rotate(45 89 89)"/>
    <rect x="1080" y="530" width="14" height="14" fill="none" stroke="rgba(244,212,77,0.18)" stroke-width="1.5" transform="rotate(45 1087 537)"/>
  </svg>

  <!-- Barre accent gauche -->
  <div class="accent-bar"></div>

  <!-- Contenu principal -->
  <div class="content">
    <div class="eyebrow">Courtier agréé ORIAS</div>

    <div class="wordmark-wrap">
      <div class="wordmark-accent"></div>
      <div class="wordmark">Z<span>'</span>EXPERT</div>
    </div>

    <div class="divider"></div>

    <div class="tagline">
      <strong>Crédit immobilier</strong> · Assurance emprunteur<br>
      Accompagnement personnalisé, du projet à la signature
    </div>

    <div class="location">
      <span>Nancy</span>
      <div class="location-dot"></div>
      <span>Metz</span>
      <div class="location-dot"></div>
      <span>Grand Est</span>
    </div>
  </div>

  <!-- URL bas-droite -->
  <div class="url-badge">zexpert-courtage.com</div>

  <!-- Certification bas-gauche -->
  <div class="cert-badge">
    <div class="cert-icon">
      <svg width="10" height="10" viewBox="0 0 10 10" xmlns="http://www.w3.org/2000/svg">
        <polyline points="1.5,5 4,7.5 8.5,2.5" fill="none" stroke="rgba(244,212,77,0.7)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <span class="cert-text">Enregistré ORIAS · Membre APIC</span>
  </div>
</div>
</body>
</html>
