<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    font-family: 'Montserrat', 'Arial Black', sans-serif;
  }
  .canvas {
    width: 1200px; height: 630px; position: relative; overflow: hidden;
    background: linear-gradient(130deg, #0d7fa0 0%, #109DBB 40%, #0b88a8 70%, #075d78 100%);
  }

  /* Grille fond */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 60px 60px;
  }

  /* Glow blanc centre */
  .glow {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 700px; height: 700px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.10) 0%, transparent 65%);
  }

  /* Glow jaune droite */
  .glow-yellow {
    position: absolute; right: -100px; top: -100px;
    width: 400px; height: 400px; border-radius: 50%;
    background: radial-gradient(circle, rgba(244,212,77,0.18) 0%, transparent 70%);
  }

  /* Bande jaune bas */
  .bottom-band {
    position: absolute; bottom: 0; left: 0; right: 0; height: 6px;
    background: #F4D44D;
  }

  /* Contenu */
  .content {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 50px 80px;
  }

  /* Accroche principale */
  .hook {
    font-family: 'Montserrat', sans-serif; font-weight: 800;
    font-size: 54px; line-height: 1.1; color: #fff;
    text-align: center; letter-spacing: -0.02em;
    margin-bottom: 20px;
    text-shadow: 0 2px 20px rgba(0,0,0,0.15);
  }
  .hook em {
    font-style: normal; color: #F4D44D;
  }

  /* Sous-titre */
  .sub {
    font-size: 22px; font-weight: 400; color: rgba(255,255,255,0.85);
    text-align: center; margin-bottom: 40px; line-height: 1.5;
  }

  /* CTA pill */
  .cta-row {
    display: flex; gap: 16px; align-items: center; margin-bottom: 44px;
  }
  .cta-pill {
    background: #fff; color: #071c2a;
    padding: 14px 36px; border-radius: 50px;
    font-size: 16px; font-weight: 800; letter-spacing: 0.02em;
    box-shadow: 0 4px 24px rgba(0,0,0,0.15);
  }
  .cta-ghost {
    color: rgba(255,255,255,0.85); font-size: 15px; font-weight: 500;
    display: flex; align-items: center; gap: 8px;
  }
  .check {
    width: 20px; height: 20px; border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.5);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 11px;
  }

  /* Proof badges */
  .proofs {
    display: flex; gap: 28px; align-items: center;
    border-top: 1px solid rgba(255,255,255,0.18); padding-top: 28px;
    width: 100%; justify-content: center;
  }
  .proof-item {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .proof-num {
    font-size: 28px; font-weight: 800; color: #fff;
  }
  .proof-label {
    font-size: 12px; font-weight: 400; color: rgba(255,255,255,0.65);
    letter-spacing: 0.08em; text-transform: uppercase;
  }
  .proof-sep {
    width: 1px; height: 40px; background: rgba(255,255,255,0.2);
  }

  /* Logo bas-gauche */
  .logo-mark {
    position: absolute; top: 30px; left: 48px;
    font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 22px;
    color: rgba(255,255,255,0.9); letter-spacing: 0.05em;
  }
  .logo-mark span { color: #F4D44D; }

  /* URL bas-droit */
  .url {
    position: absolute; bottom: 22px; right: 48px;
    font-size: 13px; color: rgba(255,255,255,0.45); letter-spacing: 0.06em;
  }
</style>
</head>
<body>
<div class="canvas">
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="glow-yellow"></div>
  <div class="bottom-band"></div>

  <!-- Logo -->
  <div class="logo-mark">Z<span>'</span>EXPERT</div>

  <!-- URL -->
  <div class="url">zexpert-courtage.com</div>

  <div class="content">
    <div class="hook">
      Obtenez le <em>meilleur taux</em><br>pour votre crédit immobilier
    </div>

    <div class="sub">
      Votre courtier à Nancy compare 20+ banques pour vous.
    </div>

    <div class="cta-row">
      <div class="cta-pill">Simulation gratuite →</div>
      <div class="cta-ghost">
        <span class="check">✓</span>
        Sans engagement
      </div>
    </div>

    <div class="proofs">
      <div class="proof-item">
        <div class="proof-num">+150</div>
        <div class="proof-label">Dossiers financés</div>
      </div>
      <div class="proof-sep"></div>
      <div class="proof-item">
        <div class="proof-num">20+</div>
        <div class="proof-label">Banques comparées</div>
      </div>
      <div class="proof-sep"></div>
      <div class="proof-item">
        <div class="proof-num">4.9★</div>
        <div class="proof-label">Note Google</div>
      </div>
      <div class="proof-sep"></div>
      <div class="proof-item">
        <div class="proof-num">100%</div>
        <div class="proof-label">Gratuit</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
